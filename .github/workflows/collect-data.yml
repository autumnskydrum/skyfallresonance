name: Collect data

# Vercel Hobby 플랜의 크론은 하루 1회로 제한되어 있어서, 대신 GitHub Actions로
# 배포된 사이트의 수집 엔드포인트를 주기적으로 호출한다.
# SITE_URL(repo variable)은 배포 후 실제 URL로 설정해야 동작한다.

on:
  schedule:
    - cron: "7,37 * * * *" # 날씨: 30분마다 (정각·30분에서 벗어나 GitHub Actions 부하 지연 회피)
    - cron: "13 * * * *" # 뉴스: 매시 정각 부근이 아닌 13분에 실행 (동일한 이유)
  workflow_dispatch: {}

jobs:
  weather:
    if: github.event.schedule == '7,37 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weather collection
        run: |
          curl -sf -X POST "${{ vars.SITE_URL }}/api/weather/collect" \
            -H "Authorization: Bearer ${{ secrets.WEATHER_COLLECT_SECRET }}"

  news:
    if: github.event.schedule == '13 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger news crawl
        run: |
          curl -sf -X POST "${{ vars.SITE_URL }}/api/news/crawl" \
            -H "Authorization: Bearer ${{ secrets.NEWS_CRAWL_SECRET }}"
