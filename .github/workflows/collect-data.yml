name: Collect data

# Vercel Hobby 플랜의 크론은 하루 1회로 제한되어 있어서, 대신 GitHub Actions로
# 배포된 사이트의 수집 엔드포인트를 주기적으로 호출한다.
# SITE_URL(repo variable)은 배포 후 실제 URL로 설정해야 동작한다.

on:
  schedule:
    # 2026-08-12: 위 7,37 값으로 4시간+ 넘게 예약 실행이 한 번도 안 떠서(부하 지연이 아니라 아예
    # 등록이 안 된 것으로 보임), 값을 실제로 바꿔서 GitHub이 스케줄을 다시 등록하도록 강제한다.
    - cron: "9,39 * * * *" # 날씨: 30분마다 (정각·30분에서 벗어나 GitHub Actions 부하 지연 회피)
    - cron: "21 * * * *" # 뉴스: 매시 정각 부근이 아닌 21분에 실행 (동일한 이유)
  workflow_dispatch: {}

jobs:
  weather:
    if: github.event.schedule == '9,39 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weather collection
        run: |
          curl -sf -X POST "${{ vars.SITE_URL }}/api/weather/collect" \
            -H "Authorization: Bearer ${{ secrets.WEATHER_COLLECT_SECRET }}"

  news:
    if: github.event.schedule == '21 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger news crawl
        run: |
          curl -sf -X POST "${{ vars.SITE_URL }}/api/news/crawl" \
            -H "Authorization: Bearer ${{ secrets.NEWS_CRAWL_SECRET }}"
